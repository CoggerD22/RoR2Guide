name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The data gates run HERE, not only in ci.yml. Both workflows trigger on push to
      # main independently, so a failing audit in CI would not have stopped this job from
      # publishing — the checks that exist to keep false data off the site were not
      # actually gating the site. Duplicating a few seconds of work is the correct price
      # for making publication conditional on them.
      #
      # data:verify degrades to a no-op without .gamedata (git-ignored), so it stays
      # green here while still enforcing the self-consistency half.
      - name: Typecheck
        run: pnpm typecheck

      - name: Data audit
        run: pnpm data:audit

      - name: Data verify
        run: pnpm data:verify

      - name: Unit tests
        run: pnpm test:unit

      # The browser tests gate PUBLICATION, not just CI.
      #
      # The steps above were added because deploy.yml triggers on push to main independently
      # of ci.yml, so a failing check there could not stop this job. That reasoning was right
      # and the fix was incomplete: Playwright was left in ci.yml only, and the guard that
      # was supposed to enforce this settled for "Playwright must run somewhere".
      #
      # Somewhere is not the deploy path. These tests catch things no unit test can — the
      # non-affiliation disclaimer (rule #6) actually rendering, and the amber callout that
      # carries every correction in MATH-VERIFICATION appearing on the page at all. Both were
      # verified by deliberate breakage (§3j.116, §3j.123). A change that removes either would
      # have deployed clean (§3j.139).
      #
      # BUILD FIRST. Most of the suite drives its own dev server and needs no build, which is
      # what this comment used to say and stop at — but §3j.150 added tests/built-site.spec.ts,
      # which serves `dist/` the way GitHub Pages does, because only the built tree says what
      # Pages will actually serve. With the old order that suite met a fresh checkout with no
      # dist/, asserted so (rather than skipping, per §3j.148), and failed — so **this deploy
      # job has been failing since that commit**. The test was right and the order was wrong.
      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
