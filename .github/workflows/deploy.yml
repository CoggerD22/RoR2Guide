name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The data gates run HERE, not only in ci.yml. Both workflows trigger on push to
      # main independently, so a failing audit in CI would not have stopped this job from
      # publishing — the checks that exist to keep false data off the site were not
      # actually gating the site. Duplicating a few seconds of work is the correct price
      # for making publication conditional on them.
      #
      # data:verify degrades to a no-op without .gamedata (git-ignored), so it stays
      # green here while still enforcing the self-consistency half.
      - name: Typecheck
        run: pnpm typecheck

      - name: Data audit
        run: pnpm data:audit

      - name: Data verify
        run: pnpm data:verify

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a copy
      # of index.html lets client-side routes (/planner, /stats, …) deep-link.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
